workflows:
  android-build:
    name: Trink Fit Build
    max_build_duration: 45

    environment:
      flutter: stable

    scripts:
      - name: Create Flutter project
        script: |
          flutter create app --platforms=android --project-name trink_fit --org com.trinkfit

      - name: Replace main.dart
        script: |
          cd app
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const TrinkFitApp());
          }

          class TrinkFitApp extends StatelessWidget {
            const TrinkFitApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Trink Fit',
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: AppColors.background,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: AppColors.primary,
                    primary: AppColors.primary,
                    secondary: AppColors.secondary,
                    brightness: Brightness.light,
                  ),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: AppColors.background,
                    foregroundColor: AppColors.text,
                    elevation: 0,
                    centerTitle: false,
                  ),
                  cardTheme: CardThemeData(
                    color: AppColors.card,
                    elevation: 0,
                    shape: RoundedRectangleBorder(
                      borderRadius: BorderRadius.circular(24),
                    ),
                  ),
                  textTheme: const TextTheme(
                    headlineMedium: TextStyle(
                      color: AppColors.text,
                      fontWeight: FontWeight.w700,
                    ),
                    bodyMedium: TextStyle(
                      color: AppColors.subtext,
                    ),
                  ),
                ),
                home: const MainShell(),
              );
            }
          }

          class AppColors {
            static const Color primary = Color(0xFF2F80ED);
            static const Color secondary = Color(0xFF56CCF2);
            static const Color background = Color(0xFFFFFFFF);
            static const Color card = Color(0xFFF5F9FF);
            static const Color text = Color(0xFF1F2937);
            static const Color subtext = Color(0xFF6B7280);
            static const Color premium = Color(0xFFF2C94C);
          }

          class MainShell extends StatefulWidget {
            const MainShell({super.key});

            @override
            State<MainShell> createState() => _MainShellState();
          }

          class _MainShellState extends State<MainShell> {
            int currentIndex = 0;

            @override
            Widget build(BuildContext context) {
              final pages = <Widget>[
                const HomePage(),
                const PlansPage(),
                const ExercisePage(),
                const NutritionPage(),
                const MindPage(),
                const ProfilePage(),
              ];

              return Scaffold(
                body: SafeArea(child: pages[currentIndex]),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: currentIndex,
                  onDestinationSelected: (value) {
                    setState(() {
                      currentIndex = value;
                    });
                  },
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.home_outlined),
                      selectedIcon: Icon(Icons.home),
                      label: 'Planım',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.fitness_center_outlined),
                      selectedIcon: Icon(Icons.fitness_center),
                      label: 'Egzersiz',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.restaurant_menu_outlined),
                      selectedIcon: Icon(Icons.restaurant_menu),
                      label: 'Beslenme',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.spa_outlined),
                      selectedIcon: Icon(Icons.spa),
                      label: 'Zihin',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.person_outline),
                      selectedIcon: Icon(Icons.person),
                      label: 'Profil',
                    ),
                  ],
                ),
              );
            }
          }

          class HomePage extends StatelessWidget {
            const HomePage({super.key});

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  Row(
                    children: [
                      Container(
                        width: 52,
                        height: 52,
                        decoration: BoxDecoration(
                          color: AppColors.card,
                          borderRadius: BorderRadius.circular(16),
                        ),
                        child: const Icon(Icons.favorite, color: AppColors.primary),
                      ),
                      const SizedBox(width: 12),
                      const Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              'Trink Fit',
                              style: TextStyle(
                                fontSize: 26,
                                fontWeight: FontWeight.w700,
                                color: AppColors.text,
                              ),
                            ),
                            SizedBox(height: 2),
                            Text(
                              'Your Personal Fitness Coach',
                              style: TextStyle(color: AppColors.subtext),
                            ),
                          ],
                        ),
                      ),
                      IconButton(
                        onPressed: () {},
                        icon: const Icon(Icons.notifications_none),
                      ),
                    ],
                  ),
                  const SizedBox(height: 20),
                  _sectionTitle('Merhaba 👋'),
                  const SizedBox(height: 8),
                  const Text(
                    'Bugün hazır mısın?',
                    style: TextStyle(color: AppColors.subtext),
                  ),
                  const SizedBox(height: 16),
                  _bigCard(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Text(
                          'Bugünün Antrenmanı',
                          style: TextStyle(
                            fontSize: 20,
                            fontWeight: FontWeight.w700,
                            color: AppColors.text,
                          ),
                        ),
                        const SizedBox(height: 12),
                        const Text(
                          'Full Body • 20 dakika • 160 kcal',
                          style: TextStyle(color: AppColors.subtext),
                        ),
                        const SizedBox(height: 16),
                        _primaryButton(
                          text: 'Başla',
                          onPressed: () {
                            Navigator.push(
                              context,
                              MaterialPageRoute(
                                builder: (_) => const WorkoutPlayerPage(),
                              ),
                            );
                          },
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 20),
                  _sectionTitle('Haftalık İlerleme'),
                  const SizedBox(height: 12),
                  Row(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: const [
                      _DayChip('Pzt', true),
                      _DayChip('Sal', true),
                      _DayChip('Çar', false),
                      _DayChip('Per', false),
                      _DayChip('Cum', false),
                    ],
                  ),
                  const SizedBox(height: 20),
                  _sectionTitle('Öne Çıkan Planlar'),
                  const SizedBox(height: 12),
                  _planTile('Yağ Yakıcı', '12 hafta • Kardiyo + güç'),
                  _planTile('Kas Yapıcı', '10 hafta • Güç + direnç'),
                  _planTile('HIIT Başlangıç', '6 hafta • Kısa yoğun antrenman'),
                ],
              );
            }
          }

          class PlansPage extends StatelessWidget {
            const PlansPage({super.key});

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  _pageHeader('Planlar', 'Sana uygun planı seç'),
                  const SizedBox(height: 16),
                  _planCard(
                    context,
                    title: 'Yağ Yakıcı',
                    subtitle: '12 hafta • Kardiyo + güç',
                    premium: false,
                  ),
                  _planCard(
                    context,
                    title: 'Kas Yapıcı',
                    subtitle: '10 hafta • Strength training',
                    premium: false,
                  ),
                  _planCard(
                    context,
                    title: 'HIIT Patlama',
                    subtitle: '6 hafta • Yüksek tempo',
                    premium: true,
                  ),
                  _planCard(
                    context,
                    title: 'Esneme & Mobilite',
                    subtitle: '4 hafta • Esneklik odaklı',
                    premium: true,
                  ),
                ],
              );
            }

            Widget _planCard(
              BuildContext context, {
              required String title,
              required String subtitle,
              required bool premium,
            }) {
              return Padding(
                padding: const EdgeInsets.only(bottom: 12),
                child: _bigCard(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Row(
                        children: [
                          Expanded(
                            child: Text(
                              title,
                              style: const TextStyle(
                                fontSize: 18,
                                fontWeight: FontWeight.w700,
                                color: AppColors.text,
                              ),
                            ),
                          ),
                          if (premium)
                            const Icon(Icons.workspace_premium, color: AppColors.premium),
                        ],
                      ),
                      const SizedBox(height: 6),
                      Text(subtitle, style: const TextStyle(color: AppColors.subtext)),
                      const SizedBox(height: 14),
                      _primaryButton(
                        text: premium ? 'Premium Gör' : 'Başla',
                        onPressed: () {
                          Navigator.push(
                            context,
                            MaterialPageRoute(
                              builder: (_) => premium
                                  ? const PremiumPage()
                                  : const ExerciseDetailPage(),
                            ),
                          );
                        },
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class ExercisePage extends StatelessWidget {
            const ExercisePage({super.key});

            @override
            Widget build(BuildContext context) {
              final items = [
                'Jumping Jacks',
                'Bodyweight Squat',
                'Push Up',
                'Forward Lunge',
                'Plank',
                'Mountain Climbers',
                'Glute Bridge',
                'Bicycle Crunch',
              ];

              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  _pageHeader('Egzersizler', 'Temel hareket kütüphanesi'),
                  const SizedBox(height: 16),
                  ...items.map(
                    (e) => Padding(
                      padding: const EdgeInsets.only(bottom: 12),
                      child: InkWell(
                        borderRadius: BorderRadius.circular(20),
                        onTap: () {
                          Navigator.push(
                            context,
                            MaterialPageRoute(
                              builder: (_) => ExerciseDetailPage(title: e),
                            ),
                          );
                        },
                        child: _bigCard(
                          child: Row(
                            children: [
                              Container(
                                width: 56,
                                height: 56,
                                decoration: BoxDecoration(
                                  color: Colors.white,
                                  borderRadius: BorderRadius.circular(16),
                                ),
                                child: const Icon(
                                  Icons.play_circle_outline,
                                  color: AppColors.primary,
                                ),
                              ),
                              const SizedBox(width: 12),
                              Expanded(
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Text(
                                      e,
                                      style: const TextStyle(
                                        fontSize: 16,
                                        fontWeight: FontWeight.w700,
                                        color: AppColors.text,
                                      ),
                                    ),
                                    const SizedBox(height: 4),
                                    const Text(
                                      'Ayrı egzersiz ekranı',
                                      style: TextStyle(color: AppColors.subtext),
                                    ),
                                  ],
                                ),
                              ),
                              const Icon(Icons.chevron_right),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ),
                ],
              );
            }
          }

          class ExerciseDetailPage extends StatelessWidget {
            final String title;

            const ExerciseDetailPage({
              super.key,
              this.title = 'Jumping Jacks',
            });

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(title)),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Container(
                      height: 260,
                      decoration: BoxDecoration(
                        color: AppColors.card,
                        borderRadius: BorderRadius.circular(24),
                      ),
                      child: const Center(
                        child: Text(
                          'Burada gerçek egzersiz videosu / GIF olacak',
                          style: TextStyle(
                            color: AppColors.subtext,
                            fontWeight: FontWeight.w600,
                          ),
                        ),
                      ),
                    ),
                    const SizedBox(height: 16),
                    Text(
                      title,
                      style: const TextStyle(
                        fontSize: 28,
                        fontWeight: FontWeight.w700,
                        color: AppColors.text,
                      ),
                    ),
                    const SizedBox(height: 8),
                    const Text(
                      'Cardio • Beginner • 30 sn • 8 kcal',
                      style: TextStyle(color: AppColors.subtext),
                    ),
                    const SizedBox(height: 16),
                    _bigCard(
                      child: const Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            'Çalışan Kaslar',
                            style: TextStyle(
                              fontWeight: FontWeight.w700,
                              color: AppColors.text,
                            ),
                          ),
                          SizedBox(height: 8),
                          Text('• Omuz'),
                          Text('• Bacak'),
                          Text('• Core'),
                        ],
                      ),
                    ),
                    const SizedBox(height: 12),
                    _bigCard(
                      child: const Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            'Nasıl Yapılır',
                            style: TextStyle(
                              fontWeight: FontWeight.w700,
                              color: AppColors.text,
                            ),
                          ),
                          SizedBox(height: 8),
                          Text('1. Dik dur'),
                          Text('2. Zıplayarak bacakları aç'),
                          Text('3. Kolları yukarı kaldır'),
                          Text('4. Başlangıç pozisyonuna dön'),
                        ],
                      ),
                    ),
                    const SizedBox(height: 20),
                    _primaryButton(
                      text: 'Antrenmanı Başlat',
                      onPressed: () {
                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (_) => WorkoutPlayerPage(title: title),
                          ),
                        );
                      },
                    ),
                  ],
                ),
              );
            }
          }

          class WorkoutPlayerPage extends StatelessWidget {
            final String title;

            const WorkoutPlayerPage({
              super.key,
              this.title = 'Jumping Jacks',
            });

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(title)),
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      children: [
                        Expanded(
                          child: Container(
                            width: double.infinity,
                            decoration: BoxDecoration(
                              color: AppColors.card,
                              borderRadius: BorderRadius.circular(24),
                            ),
                            child: const Center(
                              child: Text(
                                'Burada tam ekran egzersiz videosu olacak',
                                style: TextStyle(
                                  color: AppColors.subtext,
                                  fontWeight: FontWeight.w600,
                                ),
                              ),
                            ),
                          ),
                        ),
                        const SizedBox(height: 20),
                        Text(
                          title,
                          style: const TextStyle(
                            fontSize: 24,
                            fontWeight: FontWeight.w700,
                            color: AppColors.text,
                          ),
                        ),
                        const SizedBox(height: 8),
                        const Text(
                          '00:28',
                          style: TextStyle(
                            fontSize: 48,
                            fontWeight: FontWeight.w800,
                            color: AppColors.primary,
                          ),
                        ),
                        const SizedBox(height: 8),
                        const Text(
                          'Sıradaki hareket: Mountain Climbers',
                          style: TextStyle(color: AppColors.subtext),
                        ),
                        const SizedBox(height: 20),
                        Row(
                          children: [
                            Expanded(
                              child: OutlinedButton(
                                onPressed: () {},
                                child: const Text('Duraklat'),
                              ),
                            ),
                            const SizedBox(width: 12),
                            Expanded(
                              child: FilledButton(
                                style: FilledButton.styleFrom(
                                  backgroundColor: AppColors.primary,
                                  foregroundColor: Colors.white,
                                ),
                                onPressed: () {},
                                child: const Text('Geç'),
                              ),
                            ),
                          ],
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class NutritionPage extends StatelessWidget {
            const NutritionPage({super.key});

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  _pageHeader('Beslenme', 'Sağlıklı yaşam içerikleri'),
                  const SizedBox(height: 16),
                  _simpleTile('Yağ yakma diyeti'),
                  _simpleTile('Kas kazanım menüsü'),
                  _simpleTile('Protein hesaplayıcı'),
                  _simpleTile('Su takibi'),
                ],
              );
            }
          }

          class MindPage extends StatelessWidget {
            const MindPage({super.key});

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  _pageHeader('Zihin', 'Nefes ve rahatlama'),
                  const SizedBox(height: 16),
                  _simpleTile('5 dk meditasyon'),
                  _simpleTile('Nefes egzersizi'),
                  _simpleTile('Uyku rahatlatma'),
                  _simpleTile('Motivasyon kartları'),
                ],
              );
            }
          }

          class ProfilePage extends StatelessWidget {
            const ProfilePage({super.key});

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  _pageHeader('Profil', 'Kişisel bilgiler ve ilerleme'),
                  const SizedBox(height: 16),
                  _bigCard(
                    child: const Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('Boy: 178 cm'),
                        SizedBox(height: 8),
                        Text('Kilo: 82 kg'),
                        SizedBox(height: 8),
                        Text('Hedef: 75 kg'),
                      ],
                    ),
                  ),
                  const SizedBox(height: 12),
                  _bigCard(
                    child: const Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          'Kilo Grafiği',
                          style: TextStyle(
                            fontWeight: FontWeight.w700,
                            color: AppColors.text,
                          ),
                        ),
                        SizedBox(height: 12),
                        Text('Burada ilerleme grafiği olacak'),
                      ],
                    ),
                  ),
                  const SizedBox(height: 12),
                  _primaryButton(
                    text: 'Premium Gör',
                    onPressed: () {
                      Navigator.push(
                        context,
                        MaterialPageRoute(builder: (_) => const PremiumPage()),
                      );
                    },
                  ),
                ],
              );
            }
          }

          class PremiumPage extends StatelessWidget {
            const PremiumPage({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Trink Fit Premium')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Container(
                      padding: const EdgeInsets.all(20),
                      decoration: BoxDecoration(
                        color: AppColors.card,
                        borderRadius: BorderRadius.circular(24),
                        border: Border.all(color: AppColors.premium),
                      ),
                      child: const Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            'Unlock Trink Fit Premium',
                            style: TextStyle(
                              fontSize: 24,
                              fontWeight: FontWeight.w700,
                              color: AppColors.text,
                            ),
                          ),
                          SizedBox(height: 10),
                          Text('✔ 300+ egzersiz'),
                          Text('✔ kişisel plan'),
                          Text('✔ reklamsız kullanım'),
                          Text('✔ gelişmiş analiz'),
                        ],
                      ),
                    ),
                    const SizedBox(height: 16),
                    _priceCard('1 Ay', '179 TL', false),
                    _priceCard('3 Ay', '399 TL', false),
                    _priceCard('12 Ay', '569 TL', true),
                    const SizedBox(height: 16),
                    _primaryButton(
                      text: 'Premium’a Geç',
                      onPressed: () {},
                    ),
                  ],
                ),
              );
            }

            Widget _priceCard(String title, String price, bool best) {
              return Padding(
                padding: const EdgeInsets.only(bottom: 12),
                child: Container(
                  padding: const EdgeInsets.all(16),
                  decoration: BoxDecoration(
                    color: AppColors.card,
                    borderRadius: BorderRadius.circular(20),
                    border: Border.all(
                      color: best ? AppColors.premium : AppColors.primary.withOpacity(0.15),
                    ),
                  ),
                  child: Row(
                    children: [
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              title,
                              style: const TextStyle(
                                fontSize: 18,
                                fontWeight: FontWeight.w700,
                                color: AppColors.text,
                              ),
                            ),
                            const SizedBox(height: 4),
                            Text(price, style: const TextStyle(color: AppColors.subtext)),
                          ],
                        ),
                      ),
                      if (best)
                        Container(
                          padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                          decoration: BoxDecoration(
                            color: AppColors.premium,
                            borderRadius: BorderRadius.circular(12),
                          ),
                          child: const Text(
                            'En iyi fiyat',
                            style: TextStyle(
                              color: Colors.black,
                              fontWeight: FontWeight.w700,
                            ),
                          ),
                        ),
                    ],
                  ),
                ),
              );
            }
          }

          class _DayChip extends StatelessWidget {
            final String label;
            final bool done;

            const _DayChip(this.label, this.done);

            @override
            Widget build(BuildContext context) {
              return Container(
                padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 10),
                decoration: BoxDecoration(
                  color: done ? AppColors.primary : AppColors.card,
                  borderRadius: BorderRadius.circular(16),
                ),
                child: Text(
                  label,
                  style: TextStyle(
                    color: done ? Colors.white : AppColors.text,
                    fontWeight: FontWeight.w600,
                  ),
                ),
              );
            }
          }

          Widget _pageHeader(String title, String subtitle) {
            return Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                Text(
                  title,
                  style: const TextStyle(
                    fontSize: 28,
                    fontWeight: FontWeight.w700,
                    color: AppColors.text,
                  ),
                ),
                const SizedBox(height: 6),
                Text(subtitle, style: const TextStyle(color: AppColors.subtext)),
              ],
            );
          }

          Widget _sectionTitle(String title) {
            return Text(
              title,
              style: const TextStyle(
                fontSize: 20,
                fontWeight: FontWeight.w700,
                color: AppColors.text,
              ),
            );
          }

          Widget _bigCard({required Widget child}) {
            return Container(
              padding: const EdgeInsets.all(18),
              decoration: BoxDecoration(
                color: AppColors.card,
                borderRadius: BorderRadius.circular(24),
              ),
              child: child,
            );
          }

          Widget _simpleTile(String text) {
            return Padding(
              padding: const EdgeInsets.only(bottom: 12),
              child: _bigCard(
                child: Row(
                  children: [
                    const Icon(Icons.chevron_right, color: AppColors.primary),
                    const SizedBox(width: 10),
                    Expanded(
                      child: Text(
                        text,
                        style: const TextStyle(
                          fontWeight: FontWeight.w600,
                          color: AppColors.text,
                        ),
                      ),
                    ),
                  ],
                ),
              ),
            );
          }

          Widget _planTile(String title, String subtitle) {
            return Padding(
              padding: const EdgeInsets.only(bottom: 12),
              child: _bigCard(
                child: Row(
                  children: [
                    Container(
                      width: 52,
                      height: 52,
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(16),
                      ),
                      child: const Icon(Icons.local_fire_department, color: AppColors.primary),
                    ),
                    const SizedBox(width: 12),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            title,
                            style: const TextStyle(
                              fontSize: 16,
                              fontWeight: FontWeight.w700,
                              color: AppColors.text,
                            ),
                          ),
                          const SizedBox(height: 4),
                          Text(subtitle, style: const TextStyle(color: AppColors.subtext)),
                        ],
                      ),
                    ),
                  ],
                ),
              ),
            );
          }

          Widget _primaryButton({
            required String text,
            required VoidCallback onPressed,
          }) {
            return SizedBox(
              width: double.infinity,
              child: FilledButton(
                style: FilledButton.styleFrom(
                  backgroundColor: AppColors.primary,
                  foregroundColor: Colors.white,
                  padding: const EdgeInsets.symmetric(vertical: 16),
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(18),
                  ),
                ),
                onPressed: onPressed,
                child: Text(text),
              ),
            );
          }
          EOF

      - name: Build APK
        script: |
          cd app
