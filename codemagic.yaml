workflows:
  android-build:
    name: Trink Fit Android Build
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Show project files
        script: |
          pwd
          ls -la

      - name: Create Android folder if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create .
          fi

      - name: Flutter clean
        script: |
          flutter clean

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
